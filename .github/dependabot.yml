version: 2
updates:
  # SDK and crate bumps: a deliberate human click (PLATFORM.md §1). fix:
  # releases a patch, which is what a merged dependency update is.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait until a release is two weeks old (as iot-platform does): most
    # malicious releases are yanked within days.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-scope: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait until a release is two weeks old (as iot-platform does): most
    # malicious releases are yanked within days.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/cloud"
    schedule:
      interval: "monthly"
    # Wait until a release is two weeks old (as iot-platform does): most
    # malicious releases are yanked within days.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
