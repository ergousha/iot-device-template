name: Release

# Every push to main runs the platform's release pipeline (iot-device-sdk
# firmware-release.yml, pinned by commit SHA): the next semver from the
# conventional commits (feat: minor, fix: patch; nothing else releases), a
# build without secrets or AWS, a signed manifest, a GitHub release (not
# marked Latest) and the upload to releases/<id>/<X.Y.Z>/. The platform's OTA controller then
# runs it on the canary, soaks it and promotes it. A failure opens an issue.
#
# Set up by `ergo product init`: repository variables AWS_ROLE_ARN and
# AWS_FIRMWARE_BUCKET, and Environment `release` with FIRMWARE_SIGNING_KEY.
# Until then (the template itself, a fresh copy) nothing runs.

on:
  push:
    branches: [ main ]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: vars.AWS_ROLE_ARN != ''
    uses: ergousha/iot-device-sdk/.github/workflows/firmware-release.yml@399a615b08520b6edc4f1e07aaee742cc7ff5de2 # fix/issue-31-explicit-release-secret
    permissions:
      contents: write # tag and GitHub release
      id-token: write # AWS OIDC, publish job only
      issues: write # "release vX.Y.Z failed"
    # Only the signing key, by name: it lives in Environment `release`, which
    # only the callee's publish job sets. The callee is pinned by SHA, and
    # the AWS role accepts only the SHAs iot-platform lists
    # (release_workflow_commits.json): bump the pin to a listed one.
    secrets:
      FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
    with:
      flash-size: 4mb
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      firmware-bucket: ${{ vars.AWS_FIRMWARE_BUCKET }}
      # Optional, newline-separated (the owner's SSID, say); not secrets.
      image-scan-forbidden: ${{ vars.IMAGE_SCAN_FORBIDDEN }}
